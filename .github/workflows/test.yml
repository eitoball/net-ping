name: Test

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        ruby: ['4.0', '3.4', '3.3', '3.2', '3.1', '3.0', '2.7']
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libcap2 libcap-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake gem:create gem:check
